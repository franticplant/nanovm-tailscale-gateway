name: Daily build

on:
  schedule:
    - cron: "0 6 * * *" # Daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: daily-build
  cancel-in-progress: false

jobs:
  build-nightly:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils

      - name: Verify Go tests
        run: |
          go vet ./...
          go test -race ./...

      - name: Build static amd64 binary
        run: |
          mkdir -p build
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o build/gateway ./cmd/gateway

      - name: Install OPS and pinned Nanos kernel
        run: |
          source config/versions.env
          mkdir -p "${HOME}/.ops/bin"
          curl -fsSL https://storage.googleapis.com/cli/linux/ops -o "${HOME}/.ops/bin/ops"
          chmod +x "${HOME}/.ops/bin/ops"
          export PATH="${HOME}/.ops/bin:${PATH}"
          ops update --version "${NANOS_VERSION}" || ops update

      - name: Build and smoke-test Nanos image
        env:
          SMOKE_TIMEOUT_SECS: "60"
        run: |
          source config/versions.env
          export PATH="${HOME}/.ops/bin:${PATH}"
          ops build build/gateway --nanos-version "${NANOS_VERSION}" -c config/ops.smoke.json -i gateway-smoke
          cp "${HOME}/.ops/images/gateway-smoke" build/gateway-smoke.img
          ./scripts/smoke-qemu.sh build/gateway-smoke.img

      - name: Package nightly artifacts
        run: |
          source config/versions.env
          export PATH="${HOME}/.ops/bin:${PATH}"
          ops build build/gateway --nanos-version "${NANOS_VERSION}" -c config/ops.example.json -i gateway-nightly
          cp "${HOME}/.ops/images/gateway-nightly" build/gateway-nightly.img
          qemu-img convert -f raw -O qcow2 -c build/gateway-nightly.img build/gateway-nightly.qcow2
          cat > build/build-info.json <<EOF
          {
            "channel": "nightly",
            "git_sha": "${GITHUB_SHA}",
            "nanos_version": "${NANOS_VERSION}",
            "ops_version": "${OPS_VERSION}",
            "built_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          (cd build && sha256sum gateway gateway-nightly.img gateway-nightly.qcow2 build-info.json > SHA256SUMS)

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            build/gateway
            build/gateway-nightly.img
            build/gateway-nightly.qcow2
            build/SHA256SUMS

      - name: Publish rolling nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly build ($(date -u +%Y-%m-%d))"
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: |
            build/gateway
            build/gateway-nightly.img
            build/gateway-nightly.qcow2
            build/build-info.json
            build/SHA256SUMS
